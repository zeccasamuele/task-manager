<div class="task-app">
  <h1>Il mio Task Manager</h1>

  <p>Benvenuto nella tua prima applicazione Angular!</p>

  <h2>Aggiungi un'attività</h2>

  <div class="task-form">
    <input type="text" placeholder="Scrivi una nuova attività..." [value]="newTaskTitle"
      (input)="newTaskTitle = $any($event.target).value" (keyup.enter)="addTask()" />

    <button type="button" (click)="addTask()">
      Aggiungi
    </button>
  </div>

  <h2>Le mie attività</h2>

  <ul>
    @for (task of tasks(); track task.id) {
    <li>
      <div class="task-row">
        <label>
          <input type="checkbox" [checked]="task.completed" (change)="toggleTask(task.id)" />

          <span [class.completed]="task.completed">
            {{ task.title }}
          </span>
        </label>

        <button type="button" class="delete-button" (click)="deleteTask(task.id)"
          [attr.aria-label]="'Elimina ' + task.title">
          Elimina
        </button>
      </div>

      <p>{{ task.description }}</p>
    </li>
    } @empty {
    <li>Non ci sono ancora attività.</li>
    }
  </ul>
</div>
